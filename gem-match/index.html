<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, minimum-scale=1, user-scalable=no, viewport-fit=cover" />
<meta name="mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
<meta name="theme-color" content="#E8C4DE" />
<title>Puzzlers &mdash; Bracket Racket</title>
<link rel="stylesheet" href="css/style.css" />
</head>
<body>
<div id="app">

  <header class="hud">
    <h1 class="title">Bracket Racket</h1>
    <div class="pill pill--score" aria-label="Score panel">
      <span class="pill__label">SCORE</span>
      <span class="pill__value" id="scoreValue">0</span>
    </div>
    <div class="pill pill--best" aria-label="Best score panel">
      <span class="pill__label">BEST</span>
      <span class="pill__value" id="bestValue">0</span>
    </div>
    <button class="btn" id="newGameBtn" type="button">New Game</button>
  </header>

  <main class="board-wrap">
    <div class="board" id="board" role="grid" aria-label="Match-3 board"></div>
    <div class="board-message" id="boardMessage" hidden></div>
  </main>

  <footer class="foot">
    <p>Swap adjacent pieces to line up 3 or more of the same color.</p>
  </footer>

</div>
<script src="js/game.js"></script>
</body>
</html>
