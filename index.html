<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, minimum-scale=1, user-scalable=no, viewport-fit=cover" />
<meta name="mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
<meta name="theme-color" content="#E8C4DE" />
<title>Puzzlers &mdash; Pipe Flow</title>
<link rel="stylesheet" href="css/style.css" />
</head>
<body>
<div id="app">

  <header id="hud" class="hud">
    <div class="pill pill--level" id="levelPanel" aria-label="Level counter">
      <div class="pill__content">
        <span class="pill__label">LEVEL</span>
        <span class="pill__value" id="levelValue">1</span>
      </div>
    </div>

    <p class="instructions">Tap a pipe to rotate it. Route the flow from
      <span class="instructions__chip instructions__chip--source">spout</span> to
      <span class="instructions__chip instructions__chip--dest">drain</span> without leaks.</p>

    <div class="pill pill--rotations" id="rotationsPanel" aria-label="Rotation counter">
      <div class="pill__content">
        <span class="pill__label">TURNS</span>
        <span class="pill__value" id="rotationsValue">0</span>
      </div>
    </div>
  </header>

  <main id="boardWrap" class="board-wrap">
    <div id="board" class="board" role="grid" aria-label="Pipe connection puzzle board"></div>
  </main>

  <div id="confetti" class="confetti" aria-hidden="true"></div>

  <div id="winToast" class="win-toast" hidden>
    <span class="win-toast__title">Flow Complete!</span>
    <span class="win-toast__subtitle" id="winSubtitle">Level 1 solved</span>
  </div>

</div>

<script src="js/game.js"></script>
</body>
</html>
